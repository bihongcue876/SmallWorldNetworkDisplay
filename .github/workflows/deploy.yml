name: deploy-pages

# 推送到 master 自动构建并发布到 GitHub Pages。
# 首次使用需在仓库 Settings → Pages → Build and deployment
# 中把 Source 设为 "GitHub Actions"。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kleinberg-nav/package-lock.json

      - name: Install dependencies
        working-directory: kleinberg-nav
        run: npm ci

      - name: Run tests
        working-directory: kleinberg-nav
        run: npx vitest run

      - name: Build
        working-directory: kleinberg-nav
        run: npx vite build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: kleinberg-nav/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
