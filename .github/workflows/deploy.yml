name: deploy-pages

# 仅手动触发。自动开通 Pages 需要仓库管理权限，GITHUB_TOKEN 拿不到，
# 所以首次必须由仓库所有者到 Settings → Pages → Build and deployment
# 把 Source 选成 "GitHub Actions"。开通成功并确认能发布之后，再把下面的
# push 触发器放开，恢复推送即部署：
#   push:
#     branches: [master]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kleinberg-nav/package-lock.json

      - name: Install dependencies
        working-directory: kleinberg-nav
        run: npm ci

      - name: Run tests
        working-directory: kleinberg-nav
        run: npx vitest run

      - name: Build
        working-directory: kleinberg-nav
        run: npx vite build

      - uses: actions/configure-pages@v5
        # 自动开通 Pages，免去手动到 Settings 里设置一次
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: kleinberg-nav/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
